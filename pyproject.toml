[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trauma-triage-vlm"
version = "0.1.0"
description = "ATLS-grounded zero-shot trauma triage pipeline"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "scikit-learn==1.3.2",
  "torch==2.1.2",
  "pydantic==2.7.1",
  "PyYAML==6.0.1",
  "typer==0.12.3",
  "rich==13.7.1"
]

[project.scripts]
trauma-triage-train = "trauma_triage_vlm.cli.train:main"
trauma-triage-evaluate = "trauma_triage_vlm.cli.evaluate:main"
trauma-triage-infer = "trauma_triage_vlm.cli.infer:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["trauma_triage_vlm"]

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true
